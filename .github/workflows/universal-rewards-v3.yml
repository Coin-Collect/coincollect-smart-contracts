name: Universal Rewards V3 contracts

on:
  pull_request:
    paths:
      - projects/universal-rewards-v3/**
      - .github/workflows/universal-rewards-v3.yml
  push:
    branches: [pool-management]
    paths:
      - projects/universal-rewards-v3/**
      - .github/workflows/universal-rewards-v3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/universal-rewards-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/universal-rewards-v3/package-lock.json
      - run: npm ci --workspaces=false --ignore-scripts
      - run: npm run --workspaces=false compile
      - run: npm test --workspaces=false

  polygon-fork:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/universal-rewards-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/universal-rewards-v3/package-lock.json
      - run: npm ci --workspaces=false --ignore-scripts
      - run: npm run --workspaces=false test:polygon-fork
        env:
          COINCOLLECT_V3_POLYGON_RPC: ${{ secrets.COINCOLLECT_V3_POLYGON_RPC }}
